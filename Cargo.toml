[package]
name = "fastlaunch"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A fast game launcher front end. Starts Epic games without the Epic Games Launcher, using a port of Legendary's launch code."

[dependencies]
# glow only: no wgpu in the shipped exe (17.9 MB -> 10.8 MB, same startup).
eframe = { version = "0.36", default-features = false, features = ["glow", "accesskit", "default_fonts", "links"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Threading"] }
winreg = "0.56.0"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "snapshot", "wgpu"] }

[build-dependencies]
embed-resource = "3.0.12"
